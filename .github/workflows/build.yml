# The repository's checks, on a pull request into main and on main: the tests (each reusable workflow naming its image
# by a full digest among them), shellcheck over the scripts and actionlint over the workflows. Every action is pinned by
# commit, and actionlint by its release's checksum.
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the tests' packages
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3
      # A reusable workflow may name the placeholder of all zeros on a pull request alone: on main, a release stamps it.
      - name: Tests
        run: python -m pytest tests -q
        env:
          IRONBEE_PLACEHOLDER_ALLOWED: ${{ github.event_name == 'pull_request' }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # lib.sh is sourced, with no shebang of its own.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --shell=bash --external-sources scripts/*.sh
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      # This actionlint does not know yet the job context's workflow_repository and workflow_sha, nor a concurrency
      # group's queue, which code-review.yml uses; nothing else is ignored.
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color \
            -ignore 'property "workflow_(repository|sha)" is not defined in object type' \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/*.yml
